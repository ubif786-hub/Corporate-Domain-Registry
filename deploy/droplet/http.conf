# Stage 1, before the domain points here: the site on plain HTTP at the server's IP, for testing,
# and the folder the certificate challenge is answered from.
# Installed as /etc/nginx/sites-available/cdr by setup.sh.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    include snippets/cdr-site.conf;
}
