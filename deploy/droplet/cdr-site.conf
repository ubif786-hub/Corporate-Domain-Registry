# The site itself, shared by the HTTP (before the certificate) and HTTPS server blocks.
# Installed as /etc/nginx/snippets/cdr-site.conf. The pages are the static export
# (apps/web/scripts/export-static.mjs); /api/ goes to the API.

root /srv/cdr/public_html;
index index.html;
error_page 404 /404.html;
absolute_redirect off;
server_tokens off;
client_max_body_size 1m;

gzip on;
gzip_types text/css application/javascript application/json text/plain text/xml image/svg+xml;

# The API (apps/api, systemd unit cdr-api) answers everything under /api/. It trusts only this
# proxy, and X-Forwarded-For is SET to the visitor's address, not appended to, so a visitor cannot
# choose the address the API sees (currency, rate limit, the IP kept with an order).
location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # The webhook answers Stripe at once; nothing here should wait long.
    proxy_read_timeout 90s;
    proxy_buffering off;
}

# No dotfiles, except certificate challenges.
location ~ /\.(?!well-known/) { return 404; }

# Retired addresses land on their successors: redirects.json, the same list as next.config.ts.
location ~ ^/lookup/?$ { return 308 /whois/; }
location ~ ^/help/?$ { return 308 /contact/; }
location ~ ^/legal(/.*)?$ { return 308 /tos/; }
location ~ ^/r/[^/]+/?$ { return 302 /search/; }
location ~ ^/pricing/?$ { return 302 /search/; }

# The build's own files are fingerprinted, so they may be cached for good.
location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# The share card is a PNG with no extension in its name.
location = /opengraph-image {
    default_type image/png;
    try_files $uri =404;
}

# Every page is a folder with an index.html; /search redirects to /search/, as on Apache.
# The admin panel's pages: never cached, never indexed, never inside another site's frame. The data
# behind them comes from /api/admin/*, which needs a signed-in session.
location /admin/ {
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "no-referrer";
    try_files $uri $uri/ =404;
}

location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
}
