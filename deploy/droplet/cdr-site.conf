# The site itself, shared by the HTTP (before the certificate) and HTTPS server blocks.
# Installed as /etc/nginx/snippets/cdr-site.conf. Says to nginx what the generated .htaccess
# (scripts/export-cpanel.mjs) says to Apache on cPanel; keep the two in step.

root /srv/cdr/public_html;
index index.html;
error_page 404 /404.html;
absolute_redirect off;
server_tokens off;
client_max_body_size 1m;

gzip on;
gzip_types text/css application/javascript application/json text/plain text/xml image/svg+xml;

# The PHP endpoints: the location lookup and the shop. Nothing else runs PHP.
location ~ ^/api/(geo|domain-check|checkout|stripe-webhook|order-status|admin|cron)/?$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/api/$1.php;
    fastcgi_param DOCUMENT_ROOT $document_root;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    # The webhook answers Stripe at once and keeps registering after (fastcgi_finish_request).
    fastcgi_read_timeout 300;
}

# No PHP source is ever served, and nothing else under api/ (the IP database, the library).
location ~ \.php$ { return 404; }
location /api/ { return 403; }

# No dotfiles (.htaccess ships in the export for cPanel), except certificate challenges.
location ~ /\.(?!well-known/) { return 404; }

# Retired addresses land on their successors: redirects.json, the same list as next.config.ts.
location ~ ^/lookup/?$ { return 308 /whois/; }
location ~ ^/help/?$ { return 308 /contact/; }
location ~ ^/legal(/.*)?$ { return 308 /tos/; }
location ~ ^/account/?$ { return 308 /login/; }
location ~ ^/r/[^/]+/?$ { return 302 /search/; }
location ~ ^/pricing/?$ { return 302 /search/; }

# The build's own files are fingerprinted, so they may be cached for good.
location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# The share card is a PNG with no extension in its name.
location = /opengraph-image {
    default_type image/png;
    try_files $uri =404;
}

# Every page is a folder with an index.html; /search redirects to /search/, as on Apache.
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
}
