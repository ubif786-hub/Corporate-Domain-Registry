# Stage 2, once the domain points here and the certificate exists (enable-https.sh):
# everything on https://www.<domain>, the bare domain and plain HTTP redirect to it.
# __WWW__ and __BARE__ are filled in by enable-https.sh.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://__WWW__$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __BARE__;
    ssl_certificate /etc/letsencrypt/live/__WWW__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__WWW__/privkey.pem;
    return 301 https://__WWW__$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __WWW__;
    ssl_certificate /etc/letsencrypt/live/__WWW__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__WWW__/privkey.pem;

    include snippets/cdr-site.conf;
}
